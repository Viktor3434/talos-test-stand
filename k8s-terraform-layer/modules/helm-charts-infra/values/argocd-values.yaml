# k8s-terraform-layer/modules/helm-charts-infra/values/argocd-values.yaml

# Глобальные настройки
global:
  domain: argocd.local  # Замените на ваш реальный домен
  logging:
    format: json
    level: info

# Controller (argocd-application-controller) - сердце ArgoCD
controller:
  replicas: 1  # Для HA можно увеличить до 2+
  
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  
  # PodDisruptionBudget для стабильности
  pdb:
    enabled: true
    minAvailable: 1
  
  # Toleration для запуска на control-plane нодах Talos
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  
  # SecurityContext для Talos
  containerSecurityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

# ArgoCD Server (UI и API)
server:
  replicas: 2  # HA для UI
  
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  # ВАЖНО: Отключаем встроенный Ingress, используем Envoy Gateway API
  ingress:
    enabled: false
  
  # Service type ClusterIP - трафик пойдет через Gateway API
  service:
    type: ClusterIP
    servicePortHttpName: http
  
  # Extra args для поддержки gRPC и HTTP
  extraArgs:
    - --insecure  # TLS терминаруется на Envoy Gateway
  
  pdb:
    enabled: true
    minAvailable: 1
  
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  
  containerSecurityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

# Repo-server (git операции)
repoServer:
  replicas: 2
  
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  
  pdb:
    enabled: true
    minAvailable: 1
  
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  
  containerSecurityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

# Redis (кеш)
redis:
  enabled: true
  
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  
  securityContext:
    runAsNonRoot: true
    runAsUser: 999

# ApplicationSet controller (для GitOps мульти-кластер)
applicationSet:
  enabled: true
  
  replicas: 1
  
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 512Mi
  
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

# Notifications controller
notifications:
  enabled: true
  
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 256Mi
  
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

# Dex (OIDC провайдер) - отключаем, если не используем внешний SSO
dex:
  enabled: false

# Конфигурация ArgoCD (хранится в ConfigMap)
configs:
  params:
    # Отключаем TLS на server (терминируем на Gateway)
    server.insecure: true
    
  cm:
    # Timeout для приложений
    timeout.reconciliation: 180s
    
    # Resource tracking method
    application.resourceTrackingMethod: annotation+label
    
    # Exec enabled для kubectl exec в UI
    exec.enabled: true
    
  rbac:
    policy.default: role:readonly
    policy.csv: |
      # Администратор имеет полный доступ
      g, admin, role:admin
      # Разработчики могут смотреть все и деплоить в dev
      p, role:developer, applications, get, */*, allow
      p, role:developer, applications, sync, */*, allow

# CRDs устанавливаются вместе с чартом
crds:
  install: true
  keep: false